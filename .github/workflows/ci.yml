name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUFF_VERSION: "0.16.6"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar ruff
        run: pip install "ruff==${RUFF_VERSION}"

      # Conjunto de reglas conservador: errores reales (pyflakes/pycodestyle),
      # no estilo. Amplía el --select cuando quieras endurecer el linter.
      - name: ruff check
        run: ruff check . --select E4,E7,E9,F,W --output-format=github

  test:
    name: Build ${{ matrix.os }} · Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Comprobar sintaxis
        run: python -m compileall -q . -x "[.]venv"

      # tkinter necesita las libs de Tcl/Tk en los runners Linux.
      - name: Instalar Tcl/Tk (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      # pet.py solo crea la ventana bajo `if __name__ == "__main__"`,
      # así que importarlo valida las dependencias sin abrir una GUI.
      - name: Smoke test (import + assets)
        shell: python {0}
        run: |
          import pathlib
          import sys

          # `shell: python {0}` guarda este script en un directorio temporal y
          # lo ejecuta desde allí, así que sys.path[0] apunta al temp dir y no
          # al repo. Hay que añadir el working directory a mano.
          sys.path.insert(0, str(pathlib.Path.cwd()))

          import pet

          assets = pathlib.Path("assets")
          faltan = [n for n in ("1.png", "2.png", "3.png") if not (assets / n).is_file()]
          assert not faltan, f"Faltan sprites: {faltan}"
          assert hasattr(pet, "VirtualPet"), "pet.VirtualPet no está definido"
          print("Smoke test OK")

      - name: Ejecutar tests (si existen)
        shell: bash
        run: |
          if compgen -G "test_*.py" > /dev/null || [ -d tests ]; then
            pip install pytest
            pytest -q
          else
            echo "Sin tests todavía; se omite."
          fi
